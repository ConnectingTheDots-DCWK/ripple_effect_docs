# Weekly and grouped, so a week's updates are a few pull requests rather than
# one per package. Nothing deploys on a merge (vercel.json), so an update is
# live only after the next `vercel --prod`.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: ["Department: Dependencies", "Type: Maintenance"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*", "starlight-*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      fonts:
        patterns: ["@fontsource-variable/*"]
      dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: ["Department: Dependencies", "Department: CI/CD", "Type: Maintenance"]
    groups:
      actions:
        patterns: ["*"]
