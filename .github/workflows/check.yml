# The checks every pull request has to pass: formatting, astro check and a
# build. The build reads the screenshots through sharp, and they are in LFS:
# pulled behind a cache keyed on the object ids, so a run that changes no image
# downloads none — LFS bandwidth is a quota, and CI should not be what spends it.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: List LFS objects
        # hashFiles reads only the workspace; the list is untracked and used only for the key.
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - run: git lfs pull

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm check
      - run: pnpm build
