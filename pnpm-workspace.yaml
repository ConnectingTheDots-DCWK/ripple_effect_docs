# This file's first job is to be *here*.
#
# This repository is also the website's submodule at `docs-site/`, and pnpm
# walks up looking for a workspace root: the landing page has one just above.
# Without this file, installing here in that checkout would be an install into
# that root — one lockfile for two projects that share no dependency. The
# nearest workspace root wins, so declaring one here keeps the two installs
# apart.
#
# `allowBuilds` is the reason the parent has one too: both are ordinary native
# builds that are genuinely needed, so they are allowed rather than left to
# prompt. sharp is what Astro's image pipeline uses; esbuild is Vite's.
allowBuilds:
  esbuild: true
  sharp: true
